name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['29']
    steps:
      - uses: actions/checkout@v4

      # The `instrument` dependency builds its NIF with CMake.
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.25.0'

      - name: Cache Hex packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-otp${{ matrix.otp }}-${{ hashFiles('rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-otp${{ matrix.otp }}-

      - name: Compile (warnings as errors)
        run: rebar3 compile

      - name: Xref
        run: rebar3 xref

      - name: EUnit
        run: rebar3 eunit

      - name: PropEr
        run: rebar3 as test proper

      # masque_interop_SUITE runs quic-go's MASQUE libraries against ours.
      - uses: actions/setup-go@v5
        with:
          go-version-file: test/interop/go.mod
          cache-dependency-path: test/interop/go.sum

      - name: Build interop helper
        working-directory: test/interop
        run: go build -o "$GITHUB_WORKSPACE/_build/masque_interop" .

      - name: Common Test
        env:
          MASQUE_GO_BIN: ${{ github.workspace }}/_build/masque_interop
        run: rebar3 ct

      - name: Upload CT logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-otp${{ matrix.otp }}
          path: _build/test/logs/
          if-no-files-found: ignore

  # Network changes on simulated Wi-Fi and mobile networks (Linux
  # namespaces, NAT and netem), see test/netsim/setup.sh.
  netsim:
    name: Simulated networks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake iproute2 iptables conntrack "linux-modules-extra-$(uname -r)" || \
            sudo apt-get install -y cmake iproute2 iptables conntrack
          sudo modprobe sch_netem

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'

      - name: Cache Hex packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-netsim-${{ hashFiles('rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-netsim-

      - name: Compile
        run: rebar3 as test compile

      - name: Build the networks
        run: sudo sh test/netsim/setup.sh

      - name: Run masque_netsim_SUITE
        run: |
          sudo env PATH="$PATH" HOME="$HOME" MASQUE_NETSIM=1 \
            ip netns exec mq_cli rebar3 ct --suite test/masque_netsim_SUITE

      - name: Upload CT logs on failure
        if: failure()
        run: sudo chown -R "$(id -u)" _build/test/logs || true

      - name: Upload CT logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ct-logs-netsim
          path: _build/test/logs/
          if-no-files-found: ignore

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rebar3 lint` compiles the project, which builds the instrument NIF.
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'

      - name: Cache Hex packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3
          key: ${{ runner.os }}-rebar3-lint-${{ hashFiles('rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-rebar3-lint-

      - name: Check formatting (erlfmt)
        run: rebar3 fmt --check

      - name: Elvis
        run: rebar3 lint

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.25.0'

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: _build/default/rebar3_*_plt
          key: ${{ runner.os }}-dialyzer-otp29-${{ hashFiles('rebar.config') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-otp29-

      - name: Dialyzer
        run: rebar3 dialyzer
